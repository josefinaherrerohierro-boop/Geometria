:root{--ink:#f4ece0;--muted:#b3a593;--red:#d7263d;--gold:#f2c14e;--bordo:#4e0505}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 120% 70% at 50% 0%,#2a1a10,#0c0806 60%,#050303);color:var(--ink);font-family:"OpenSansE","Open Sans",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.02em}.brand span{color:var(--red)}
.teamchip{display:none;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08)}
.teamchip i{width:14px;height:14px;border-radius:4px;display:inline-block}
main{padding:22px 18px 90px;max-width:560px;margin:0 auto}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.05;margin:6px 0 16px}
p{color:var(--muted);font-size:17px;line-height:1.45}
.k{color:var(--red);font-weight:800;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
.btn{display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:16px;padding:20px 20px;margin:0 0 12px;font:800 21px "OpenSansE",sans-serif;color:#fff;text-align:left;
  box-shadow:0 5px 0 rgba(0,0,0,.35);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.sel{outline:4px solid #fff}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;justify-content:center;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.num{border:none;border-radius:14px;height:64px;font:400 30px Anton,Impact,sans-serif;background:#efe6d2;color:#4e0505;box-shadow:0 4px 0 rgba(0,0,0,.35)}
input{width:100%;font:700 22px "OpenSansE",sans-serif;padding:16px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:var(--ink);margin-bottom:14px}
.big{font-family:Anton,Impact,sans-serif;font-size:64px;line-height:1;text-align:center;margin:20px 0 6px}
.center{text-align:center}
.status{position:fixed;left:0;right:0;bottom:0;padding:10px 18px;font-size:13px;color:var(--muted);background:rgba(0,0,0,.55);display:flex;justify-content:space-between}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px}
.dot.on{background:#5fd38d}
.timer{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0 18px}.timer div{height:100%;background:var(--gold);transform-origin:left}
.wave{display:flex;gap:6px;justify-content:center;height:60px;align-items:center;margin:26px 0}
.wave span{width:8px;border-radius:8px;background:var(--red);animation:w 1s ease-in-out infinite}
@keyframes w{0%,100%{height:12px}50%{height:56px}}

<script>
/* ---- Cliente MQTT mínimo sobre WebSocket (MQTT 3.1.1, QoS 0) ---- */
var MQ = (function(){
  var enc = new TextEncoder(), dec = new TextDecoder();
  function str(s){ var b = enc.encode(s); return [b.length>>8, b.length&255].concat(Array.from(b)); }
  function len(n){ var o=[]; do{ var d=n%128; n=Math.floor(n/128); if(n>0) d|=128; o.push(d);}while(n>0); return o; }
  function pkt(h, body){ return new Uint8Array([h].concat(len(body.length), body)); }
  function Client(url, opts){
    this.url=url; this.o=opts||{}; this.subs=[]; this.ok=false; this.closed=false; this.pid=1; this.buf=new Uint8Array(0);
  }
  Client.prototype.connect=function(){
    var self=this;
    return new Promise(function(res, rej){
      var done=false, ws;
      try{ ws=new WebSocket(self.url,'mqtt'); }catch(e){ rej(e); return; }
      ws.binaryType='arraybuffer'; self.ws=ws;
      var to=setTimeout(function(){ if(!done){ done=true; try{ws.close();}catch(e){} rej(new Error('timeout')); } }, self.o.timeout||6000);
      ws.onopen=function(){
        var id='gds'+Math.random().toString(36).slice(2,10);
        var body=str('MQTT').concat([4, 0x02, 0, 60], str(id));
        ws.send(pkt(0x10, body));
      };
      ws.onmessage=function(ev){
        var nb=new Uint8Array(ev.data), b=new Uint8Array(self.buf.length+nb.length); b.set(self.buf); b.set(nb,self.buf.length); self.buf=b;
        while(self.buf.length>=2){
          var mul=1, rl=0, i=1, byte;
          do{ if(i>=self.buf.length) return; byte=self.buf[i++]; rl+=(byte&127)*mul; mul*=128; }while(byte&128);
          if(self.buf.length<i+rl) return;
          var h=self.buf[0], p=self.buf.slice(i,i+rl); self.buf=self.buf.slice(i+rl);
          var type=h>>4;
          if(type===2){ if(p[1]===0){ self.ok=true; if(!done){ done=true; clearTimeout(to); res(self);} self._after(); } else if(!done){ done=true; rej(new Error('connack '+p[1])); } }
          else if(type===3){ var qos=(h>>1)&3, tl=(p[0]<<8)|p[1], topic=dec.decode(p.slice(2,2+tl)), off=2+tl+(qos?2:0);
            if(self.o.onMessage) self.o.onMessage(topic, dec.decode(p.slice(off))); }
        }
      };
      ws.onclose=function(){ var was=self.ok; self.ok=false; clearInterval(self.ping);
        if(!done){ done=true; clearTimeout(to); rej(new Error('closed')); }
        if(self.o.onState) self.o.onState(false);
        if(was && !self.closed) setTimeout(function(){ self.connect().catch(function(){}); }, 2000);
      };
      ws.onerror=function(){};
    });
  };
  Client.prototype._after=function(){ var self=this; this.subs.forEach(function(t){ self._sub(t); });
    this.ping=setInterval(function(){ try{ self.ws.send(new Uint8Array([0xC0,0])); }catch(e){} }, 25000);
    if(this.o.onState) this.o.onState(true); };
  Client.prototype._sub=function(t){ var id=this.pid++ & 0xffff || 1; this.ws.send(pkt(0x82, [id>>8, id&255].concat(str(t), [0]))); };
  Client.prototype.sub=function(t){ if(this.subs.indexOf(t)<0) this.subs.push(t); if(this.ok) this._sub(t); };
  Client.prototype.pub=function(t, msg, retain){ if(!this.ok) return false; this.ws.send(pkt(0x30|(retain?1:0), str(t).concat(Array.from(enc.encode(msg))))); return true; };
  return { Client: Client };
})();

         function(c){return '<svg width="30" height="30" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="'+c+'"/></svg>';},
         function(c){return '<svg width="30" height="30" viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" fill="'+c+'"/></svg>';} ];
var qs=new URLSearchParams(location.search), ROOM=(qs.get('r')||'').toUpperCase().replace(/[^A-Z0-9]/g,''), B=qs.get('b')||'0';
var URL_B = B==='L' ? 'ws://localhost:9001' : BROKERS[+B]||BROKERS[0];
var P='lageometriadelsonido/'+ROOM+'/';
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
var U=ls('gds_u'); if(!U){ U=Math.random().toString(36).slice(2,10); ls('gds_u',U); }
var ME={ team: ls('gds_team_'+ROOM)!==null ? +ls('gds_team_'+ROOM) : null, name: ls('gds_name')||'', joined: ls('gds_joined_'+ROOM)==='1' }, PRES=false, FRESH=false;
var TEAMS={n:4,names:['Rojo','Azul','Amarillo','Verde']}, STATE={k:'idle'}, MY={}, RECV=Date.now(), app=document.getElementById('app');
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var cli=new MQ.Client(URL_B,{onMessage:onMsg,onState:function(on){ document.getElementById('dot').className='dot'+(on?' on':''); document.getElementById('st').textContent=on?'en vivo · sala '+ROOM:'reconectando…'; if(on) hello(); }});
function send(o){ o.u=U; cli.pub(P+'in',JSON.stringify(o),false); }
function hello(){ if(ME.joined) send({t:'hello',name:ME.name}); }
function onMsg(t,m){ var o; try{ o=m?JSON.parse(m):null; }catch(e){ return; } if(!o) return;
  if(t===P+'teams'){ TEAMS=o; var sep=ls('gds_ep_'+ROOM); if(o.ep && ME.joined && sep===null) ls('gds_ep_'+ROOM,String(o.ep)); else if(o.ep && ME.joined && sep!==String(o.ep)){ ME.joined=false; ME.team=null; MY={}; ls('gds_joined_'+ROOM,'0'); try{ localStorage.removeItem('gds_team_'+ROOM); }catch(e){} }
    if(!PRES){ PRES=true; document.getElementById('pdot').className='dot on'; document.getElementById('pst').textContent='pantalla conectada'; hello(); } render(); }
  else if(t===P+'a/'+U){ if(ME.joined && typeof o.team==='number'){ if(ME.team!==o.team) FRESH=true; ME.team=o.team; ls('gds_team_'+ROOM,String(o.team)); render(); } }
  else if(t===P+'state'){ if(o.k==='q'&&o.id!==STATE.id) RECV=Date.now(); STATE=o; render(); } }
function chip(){ var c=document.getElementById('tc'); if(ME.team===null){ c.style.display='none'; return; } c.style.display='flex'; c.querySelector('i').style.background=COLORS[ME.team]; c.querySelector('b').textContent=TEAMS.names[ME.team]||''; }
var tick=null;
function render(){ chip(); clearInterval(tick);
  if(!ROOM){ app.innerHTML='<h1>Falta el código de sala</h1><p>Escaneá de nuevo el QR de la pantalla.</p>'; return; }
  if(!ME.joined){ app.innerHTML='<div class="k">Bienvenido/a</div><h1>¿Cómo te llamás?</h1><input id="nm" maxlength="16" placeholder="Tu nombre"><p>El equipo te lo sortea la presentación.</p>';
    var nm=document.getElementById('nm'); nm.value=ME.name; var b=document.createElement('button'); b.className='btn'; b.style.background='#d7263d'; b.style.justifyContent='center'; b.textContent='Entrar';
    b.onclick=function(){ ME.name=nm.value.trim().slice(0,16); ls('gds_name',ME.name); ME.joined=true; ls('gds_joined_'+ROOM,'1'); if(TEAMS.ep) ls('gds_ep_'+ROOM,String(TEAMS.ep)); hello(); render(); }; app.appendChild(b); return; }
  if(ME.team===null){ app.innerHTML='<div class="k">Un segundo…</div><h1>Sorteando tu equipo</h1><div class="wave"><span></span><span style="animation-delay:.1s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.3s"></span><span style="animation-delay:.4s"></span></div><p class="center">'+(PRES?'':'Todavía no hay conexión con la pantalla. Avisale a quien presenta.')+'</p>'; return; }
  if(FRESH){ FRESH=false; app.innerHTML='<div class="k">Te tocó el equipo</div><div class="btn" style="justify-content:center;font-size:30px;padding:34px;background:'+COLORS[ME.team]+'">'+SH[ME.team]('#fff')+'<span></span></div><p class="center">Este es tu equipo para todos los juegos.</p>';
    app.querySelector('.btn span').textContent=TEAMS.names[ME.team]||''; setTimeout(render,2600); return; }
  var s=STATE;
  if(s.k==='poll'){ app.innerHTML='<div class="k">Encuesta</div><h1></h1>'; app.querySelector('h1').textContent=s.q;
    s.opts.forEach(function(o,i){ var b=document.createElement('button'); b.className='btn'+(MY['p'+s.id]===i?' sel':''); b.style.background=COLORS[i%4]; b.innerHTML=SH[i%4]('#fff')+'<span></span>'; b.querySelector('span').textContent=o;
      b.onclick=function(){ MY['p'+s.id]=i; send({t:'vote',poll:s.id,opt:i}); render(); }; app.appendChild(b); });
    if(MY['p'+s.id]!==undefined){ var p=document.createElement('p'); p.className='center'; p.textContent='¡Voto enviado! Podés cambiarlo.'; app.appendChild(p); }
    return; }
  if(s.k==='q'){ var a=MY[s.id], over=s.t && (Date.now()-RECV)>=s.t*1000;
    if(a===undefined && over){ app.innerHTML='<div class="k"></div><div class="big" style="color:var(--muted)">⏱</div><h1 class="center">¡Se acabó el tiempo!</h1><p class="center">Esta ya no se puede responder. Mirá la pantalla.</p>'; app.querySelector('.k').textContent=s.title||'Pregunta'; return; }
    app.innerHTML='<div class="k"></div><h1></h1>'+(s.t?'<div class="timer"><div id="tb"></div></div>':''); app.querySelector('.k').textContent=s.title||'Pregunta'; app.querySelector('h1').textContent=s.q;
    if(s.t){ var tb=document.getElementById('tb'); tick=setInterval(function(){ var f=Math.max(0,1-(Date.now()-RECV)/(s.t*1000)); tb.style.transform='scaleX('+f+')'; if(f<=0 && MY[s.id]===undefined){ clearInterval(tick); render(); } },100); }
    if(a!==undefined){ app.insertAdjacentHTML('beforeend','<div class="wave"><span></span><span style="animation-delay:.1s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.3s"></span><span style="animation-delay:.4s"></span></div><p class="center">Respuesta enviada: <b></b><br>Esperá a que la revelen en la pantalla.</p>');
      app.querySelector('p b').textContent = s.type==='choice'? s.opts[a] : (s.type==='mm'? String(a).replace('.',',')+' mm' : (a===0?'al aire':'traste '+a)); return; }
    function answer(v){ if(s.t && (Date.now()-RECV)>=s.t*1000){ render(); return; } MY[s.id]=v; send({t:'ans',id:s.id,team:ME.team,v:v,ms:Date.now()-RECV}); render(); }
    if(s.type==='choice'){ s.opts.forEach(function(o,i){ var b=document.createElement('button'); b.className='btn'; b.style.background=(s.colors||COLORS)[i%4]; b.innerHTML=(s.shapes===false?'':SH[i%4]('#fff'))+'<span></span>'; b.querySelector('span').textContent=o; b.onclick=function(){ answer(i); }; app.appendChild(b); }); }
    else if(s.type==='number'){ var g=document.createElement('div'); g.className='grid'; for(var n=s.min;n<=s.max;n++){ (function(n){ var b=document.createElement('button'); b.className='num'; b.textContent=n; b.onclick=function(){ answer(n); }; g.appendChild(b); })(n); } app.appendChild(g); }
    else if(s.type==='mm'){ var fr=s.assign? s.assign[ME.team] : null;
      app.insertAdjacentHTML('beforeend','<p>Tu equipo calcula el <b style="color:var(--gold)">traste '+(fr==null?'?':fr)+'</b>. Escribí d('+(fr==null?'n':fr)+') en milímetros:</p><input id="mm" inputmode="decimal" placeholder="ej.: 163,1">');
      var bt=document.createElement('button'); bt.className='btn'; bt.style.background='#d7263d'; bt.style.justifyContent='center'; bt.textContent='Enviar';
      bt.onclick=function(){ var v=parseFloat(String(document.getElementById('mm').value).replace(',','.')); if(isFinite(v)) answer(Math.round(v*10)/10); }; app.appendChild(bt); }
    return; }
  if(s.k==='reveal'){ var a2=MY[s.id], ok=null;
    if(a2!==undefined){ if(s.type==='mm') ok=null; else ok = s.type==='number'? (a2===s.correct?2:(Math.abs(a2-s.correct)===1?1:0)) : (a2===s.correct?2:0); }
    var pts=s.pts&&s.pts[ME.team]!==undefined? s.pts[ME.team] : null;
    app.innerHTML='<div class="k">Resultado</div>'+(a2===undefined?'<div class="big" style="color:var(--muted)">—</div><p class="center">Esta no la respondiste.</p>':
      (ok===null?'<div class="big" style="color:var(--gold)">¡Listo!</div>':(ok===2?'<div class="big" style="color:#5fd38d">¡Bien!</div>':ok===1?'<div class="big" style="color:var(--gold)">¡Casi!</div>':'<div class="big" style="color:var(--red)">Uy…</div>')))+
      (pts!==null?'<p class="center">Tu equipo sumó <b style="color:var(--gold);font-size:22px">+'+pts+'</b> puntos en esta ronda.</p>':'');
    return; }
  app.innerHTML='<div class="k">Estás en el equipo</div><h1></h1><div class="wave"><span></span><span style="animation-delay:.1s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.3s"></span><span style="animation-delay:.4s"></span></div><p class="center">Mirá la pantalla. Cuando haya algo para votar o responder, aparece acá.</p>';
  app.querySelector('h1').textContent=TEAMS.names[ME.team]||'';
}
render();
cli.sub(P+'teams'); cli.sub(P+'state'); cli.sub(P+'a/'+U);
(function go(){ cli.connect().catch(function(){ document.getElementById('st').textContent='sin conexión · reintentando'; setTimeout(go,3000); }); })();
</script>
</body>
</html>
